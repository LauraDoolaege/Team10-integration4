    <script type="module">

        let tripInfo;

        let playerId
        let socket;
        let socketIds = [];
        let tripObject;

        let tripId = new URLSearchParams(window.location.search).get('trip');
        console.log('Trip ID from URL:', tripId);
        const init = () => {

            playerId = localStorage.getItem("playerId");

            if (!playerId) {
                playerId = crypto.randomUUID();
                localStorage.setItem("playerId", playerId);
            }

            console.log(`Player ID: ${playerId}`);
            socket = io.connect('/');
            socket.on('connect', () => {
                console.log(`Connected: ${socket.id}`);
                socket.emit("identify", { playerId });
                socket.emit("getTrip", tripId );
            });

            socket.on('clients', (data) => {
                console.log('clients:', data.clients);
                console.log('liveClients:', data.liveClients);
            });

            
            setQuerySelector();
            setEventListeners();

            socket.on('giveTrip', (tripObject) => {
                console.log('Trip details: ', tripObject);
                tripObject = tripObject;
                setCheckButtons(tripObject);
            });

            

        }
  
          
            
        const setCheckButtons = (tripObject) => {
            const dates = tripObject.possibleDates;

          dates.forEach(date => {
            const label = document.createElement('label');
            label.innerText = date;
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.name = 'date';
            checkbox.value = date;
            label.appendChild(checkbox);
            tripInfo.appendChild(label);
          });
        }
