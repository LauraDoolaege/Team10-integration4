<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Socket.io Client</title>
    <link rel="stylesheet" href="gov.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>
    <header>
        <h1>Official Trip Competition Portal</h1>
    </header>
    <main>
        <h2>Create a New Trip</h2>
        <form id="trip-form">
            <label>
                Café:
                <input type="text" name="cafe" required value="">
            </label>
            <label>
                Possible Dates:
                <input type="text" name="possibleDates" id="possibleDates" required>
            </label>
            <label>
                Expected Players:
                <input type="number" name="expectedPlayers" required min="1" value="4">
            </label>
            <label>
                username:
                <input type="text" name="username" id="username" required>
            </label>
            <label>
                email:
                <input type="email" name="email" required>
            </label>
        

            <button type="submit">Create Trip</button>
        </form>
        <div id="trip-result"></div>
        <a class="invite" href="" target="_blank"></a>
        <p><button id="share" style="display:none;"> share</button></p>
        <p class="result"></p>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script type="module">

        let resultPara
        let tripResult;
        let tripForm;
        let invite;
        let share
        let shareLink;

        let playerId
        let socket;
        let socketIds = [];

        const init = () => {
            playerId = localStorage.getItem("playerId");
            if (!playerId) {
                playerId = crypto.randomUUID();
                localStorage.setItem("playerId", playerId);
            }
            console.log(`Player ID: ${playerId}`);
            socket = io.connect('/');
            socket.on('connect', () => {
                console.log(`Connected: ${socket.id}`);
                socket.emit("identify", { playerId });
            });
            
            socket.on('clients', (data) => {
                console.log('clients:', data.clients);
                console.log('liveClients:', data.liveClients);
            });

            setQuerySelector();
            // Initialize flatpickr for multi-date selection
            flatpickr("#possibleDates", {
                mode: "multiple",
                dateFormat: "Y-m-d"
            });
            setEventListeners();

            socket.on('tripCreated', (tripObject) => {

                console.log('Trip created:', tripObject);
                console.log('tripObject.id:', tripObject.id);
                const tripId = tripObject.id;
                shareLink = `${window.location.origin}/friend.html?trip=${tripId}`;
                invite.href = shareLink;
                invite.innerText = shareLink;
                share.style.display = 'inline';

            });

        }

        // Trip form logic
        const setQuerySelector = () => {
            tripForm = document.querySelector('#trip-form');
            tripResult = document.querySelector('#trip-result');
            invite = document.querySelector('.invite');
            share = document.querySelector('#share');
        }

        const setEventListeners = () => {
            tripForm.addEventListener('submit', handleSubmitForm);
            share.addEventListener('click', handleShare);
            resultPara = document.querySelector('.result');
        };

        const handleShare = () => {

            let shareData = {
                title: 'Hey, come and compete for a drink!',
                text: "let's all meet up at ... at ... and compete for a drink now!",
                url: shareLink,
            };



            if (!navigator.canShare) {
                resultPara.textContent = 'Web Share API not available';
                return;
            }
            if (!navigator.canShare(shareData)) {
                resultPara.textContent = 'Share data unsupported, disallowed, or invalid';
                return;
            }
            navigator.share(shareData)
                .then(() =>
                    resultPara.textContent = 'MDN shared successfully'
                )
                .catch((e) =>
                    resultPara.textContent = 'Error: ' + e
                )

        }

    const handleSubmitForm = async (e) => {
            e.preventDefault();

            const formData = new FormData(tripForm);

            const rawDates = formData.get('possibleDates')
                .split(',')//devide large string into array devided by comma 
                .map(d => d.trim());//remove whitespace

            const votes = {};

            rawDates.forEach(date => {
                votes[date] = [];
            });


            const players = [
            {
                playerId: playerId,
                email: formData.get('email') || "",
                username: formData.get('username') || "",
                score: 10
            }
        ];

            const trip = {
                initiatorId: playerId,
                cafe: formData.get('cafe'),
                possibleDates: rawDates,
                votes,
                expectedPlayers: Number(formData.get('expectedPlayers')),
                createdAt: new Date().toISOString().slice(0, 10),
                players,
                voters: [playerId]
            };

            socket.emit("newTrip", trip);

            tripResult.innerText = `Trip created for ${trip.cafe}`;
        };

        init();
    </script>
</body>

</html>
